global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: serving
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8001"]
  - job_name: consumer
    static_configs:
      - targets: ["consumer:9101"]
  - job_name: monitor
    static_configs:
      - targets: ["monitor:9102"]
  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:9103"]
