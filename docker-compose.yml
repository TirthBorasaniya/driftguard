# DriftGuard development stack (SPEC 2). Every published port is bound to 127.0.0.1; Kafka,
# Redis, and the Schema Registry have no authentication in this local stack.
x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: driftguard-app:dev
  env_file: .env
  environment: &app-env
    DATASET: ${DATASET:-cicids2017}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    REDIS_URL: redis://redis:6379/0
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PREFECT_API_URL: http://prefect-server:4200/api
    SERVING_URL: http://serving:8001
    PROMETHEUS_URL: http://prometheus:9090
    DATA_DIR: /app/data
    OFFLINE_DIR: /app/data/offline
    RESULTS_DIR: /app/results
    PROMOTIONS_LOG_PATH: /app/results/promotions.jsonl
    ORCHESTRATOR_DB_PATH: /app/data/orchestrator.db
    FEAST_REPO_PATH: /app/data/feast/repo
  volumes:
    - ./configs:/app/configs:ro
    - ./results:/app/results
    - app_data:/app/data
  restart: unless-stopped

x-healthcheck-http: &http-health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      <<: *http-health

  redis:
    image: redis:7.4.2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      <<: *http-health

  prefect-server:
    image: prefecthq/prefect:3.4.25-python3.11
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      <<: *http-health

  prefect-worker:
    <<: *app
    command:
      - sh
      - -c
      - >
        (prefect work-pool inspect driftguard-process > /dev/null 2>&1
        || prefect work-pool create driftguard-process --type process)
        && prefect --no-prompt deploy --all
        && prefect worker start --pool driftguard-process
    environment:
      <<: *app-env
      SERVICE_NAME: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'prefect worker' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  serving:
    <<: *app
    command: ["uvicorn", "driftguard.serving.app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      <<: *app-env
      SERVICE_NAME: serving
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      <<: *http-health

  consumer:
    <<: *app
    command: ["python", "-m", "driftguard.consumer.main"]
    environment:
      <<: *app-env
      SERVICE_NAME: consumer
      METRICS_PORT: 9101
      STREAM_FEATURES_MODE: ${STREAM_FEATURES_MODE:-on}
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      serving:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/healthz')"]
      <<: *http-health

  monitor:
    <<: *app
    command: ["python", "-m", "driftguard.monitor.main"]
    environment:
      <<: *app-env
      SERVICE_NAME: monitor
      METRICS_PORT: 9102
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/healthz')"]
      <<: *http-health

  orchestrator:
    <<: *app
    command: ["python", "-m", "driftguard.orchestrator.main"]
    environment:
      <<: *app-env
      SERVICE_NAME: orchestrator
      METRICS_PORT: 9103
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      kafka:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      serving:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/healthz')"]
      <<: *http-health

  producer:
    <<: *app
    profiles: ["replay"]
    restart: "no"
    command: ["python", "-m", "driftguard.producer.replay"]
    environment:
      <<: *app-env
      SERVICE_NAME: producer
    volumes:
      - ./configs:/app/configs:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  bootstrap:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["python", "scripts/bootstrap.py"]
    environment:
      <<: *app-env
      SERVICE_NAME: bootstrap
    volumes:
      - ./configs:/app/configs:ro
      - ./results:/app/results
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - app_data:/app/data

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      <<: *http-health

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      <<: *http-health

volumes:
  kafka_data:
  redis_data:
  mlflow_data:
  prefect_data:
  prometheus_data:
  grafana_data:
  app_data:
