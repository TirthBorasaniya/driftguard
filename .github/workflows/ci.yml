name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Install Python 3.11 and dependencies
        run: uv sync --frozen --python 3.11
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: Generated files are current
        run: |
          uv run python scripts/generate_avro_schemas.py --check
          uv run python scripts/build_dashboards.py --check
          uv run python scripts/sync_chart_files.py --check
      - name: README tables match results
        run: uv run python scripts/render_results.py --check

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Install Python 3.11 and dependencies
        run: uv sync --frozen --python 3.11
      - name: Install helm and kubeconform
        run: |
          mkdir -p .cache/bin
          curl -sSfL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz --strip-components=1 -C .cache/bin linux-amd64/helm
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C .cache/bin kubeconform
      - name: Chart lint, template, and kubeconform
        run: mkdir -p .tmp && make k8s-validate
