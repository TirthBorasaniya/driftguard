name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Install Python 3.11 and dependencies
        run: uv sync --frozen --python 3.11
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: README tables match results
        run: uv run python scripts/render_results.py --check
