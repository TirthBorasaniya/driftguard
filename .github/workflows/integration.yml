name: integration

on:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADMIN_TOKEN: ci-admin-token-for-tests-only
      IP_HASH_SALT: ci-salt-for-tests-only-0123
      GF_ADMIN_PASSWORD: ci-grafana-password-0123
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
      - name: Install dependencies
        run: uv sync --frozen --python 3.11
      - name: Write .env from the example with CI secrets
        run: |
          sed -e "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=${ADMIN_TOKEN}/" \
              -e "s/^IP_HASH_SALT=.*/IP_HASH_SALT=${IP_HASH_SALT}/" \
              -e "s/^GF_ADMIN_PASSWORD=.*/GF_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}/" \
              .env.example > .env
      - name: Fit CI-only GX bounds on synthetic data when no committed bounds exist
        run: uv run python scripts/fit_gx_bounds_synthetic.py --if-missing
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Bootstrap with synthetic data
        run: docker compose run --rm bootstrap python scripts/bootstrap.py --source synthetic
      - name: Integration tests
        run: uv run pytest -m integration tests/integration -v
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose --profile replay --profile tools down -v
