[project]
name = "driftguard"
version = "2.0.0"
description = "Streaming network intrusion detection with drift monitoring, gated retraining, and safe rollout."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "scipy==1.17.1",
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "onnx==1.23.2",
    "onnxmltools==1.16.0",
    "onnxruntime==1.31.0",
    "mlflow==2.22.5",
    "prefect==3.4.25",
    "feast[redis]==0.49.0",
    "great-expectations==1.24.0",
    "evidently==0.4.40",
    "river==0.23.0",
    "confluent-kafka[avro,schemaregistry]==2.16.0",
    "fastavro==1.13.1",
    "redis==4.6.0",
    "fastapi==0.143.1",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.16.0",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis==2.40.0",
    "ruff==0.6.9",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driftguard = ["data/schemas/*.avsc"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".tmp", ".kube", "data", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["driftguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not e2e and not slow and not gpu' --ignore=.env"
markers = [
    "unit: fast tests with no external services",
    "integration: requires the Docker Compose stack",
    "e2e: end-to-end tests against the full stack",
    "slow: long-running tests",
    "gpu: requires a GPU",
]
