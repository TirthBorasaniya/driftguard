# CICIDS2017 adapter configuration (SPEC 3.2).
version: 1
dataset: cicids2017
# improved: DistriNet CNS2022 regenerated flows (default); original: CIC TrafficLabelling, comparison only
source: improved
# rows labeled "<attack> - Attempted": benign (label 0), attack (label 1), or drop
attempted_policy: benign
benign_label: BENIGN
attempted_suffix: " - Attempted"
day_order: [monday, tuesday, wednesday, thursday, friday]
processed_dir: data/processed/cicids2017

sources:
  improved:
    url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/CICIDS2017_improved.zip
    archive: CICIDS2017_improved.zip
    sha256: 97fdb91d339e2d8cf5627f981b831e5e7e400b981c58181c451a38fd03c48883
    raw_dir: data/raw/cicids2017_improved
    encoding: utf-8
    timestamp_format: "%Y-%m-%d %H:%M:%S.%f"
    files:
      monday: monday.csv
      tuesday: tuesday.csv
      wednesday: wednesday.csv
      thursday: thursday.csv
      friday: friday.csv
    columns:
      row_id: id
      flow_id: Flow ID
      src_ip: Src IP
      src_port: Src Port
      dst_ip: Dst IP
      timestamp: Timestamp
      label: Label
      attempted_category: Attempted Category
  original:
    # CIC GeneratedLabelledFlows (TrafficLabelling); no SHA-256 published by CIC, files placed manually
    url: https://www.unb.ca/cic/datasets/ids-2017.html
    archive: null
    sha256: null
    raw_dir: data/raw/cicids2017
    encoding: latin1
    timestamp_format: null
    files:
      monday: Monday-WorkingHours.pcap_ISCX.csv
      tuesday: Tuesday-WorkingHours.pcap_ISCX.csv
      wednesday: Wednesday-workingHours.pcap_ISCX.csv
      thursday: Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv
      friday: Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
    columns:
      row_id: null
      flow_id: Flow ID
      src_ip: Source IP
      src_port: Source Port
      dst_ip: Destination IP
      timestamp: Timestamp
      label: Label
      attempted_category: null

# identifiers and label columns that must never reach the model (unit-tested)
excluded_columns: [row_id, flow_id, src_ip, src_port, dst_ip, timestamp, label, attempted_category]

stream_features:
  enabled: true

# monitor windows (SPEC 5.1) and Great Expectations settings (SPEC 5.2, 6.2); bounds are fitted
# once by scripts/fit_gx_bounds.py into configs/data/cicids2017_gx_bounds.json
monitor_windows: count
gx:
  # training validation (SPEC 6.2): fitted percentile bounds and the share that must lie inside
  mostly: 0.99
  # percentile_bounds (SPEC 6.2) or physical_bounds; see DECISIONS D-022 before changing
  training_bounds: percentile_bounds
  # monitor window suite: data quality only (physical limits, finite, non-null); no row may violate
  monitor_mostly: 1.0
  min_window_rows: 100
  min_training_rows: 10000
  # initial reference data the bounds are fitted on: the initial training days
  reference_days: [monday, tuesday]

# model features: snake_case name, column in each source (null when absent), schema-level bounds
# used by the consumer's validation step (physical limits, not fitted percentiles)
features:
  - name: dst_port
    improved: "Dst Port"
    original: "Destination Port"
    min: 0
    max: 65535
  - name: protocol
    improved: "Protocol"
    original: "Protocol"
    min: 0
    max: 255
  - name: flow_duration
    improved: "Flow Duration"
    original: "Flow Duration"
