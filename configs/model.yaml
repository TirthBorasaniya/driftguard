# LightGBM model configuration (SPEC 6.2 step 3). Hyperparameters are fixed; scale_pos_weight
# is computed per training window as n_negative / n_positive.
version: 1
seed: 42
target_recall: 0.95
lightgbm:
  objective: binary
  # 100: the largest of {50, 100, 150, 200, 300, 400} whose validation threshold keeps at least
  # 1e-3 of headroom below 1.0; at 400 trees seen attackers score within 3e-6 of 1.0 and the
  # recall-targeted threshold becomes brittle (DECISIONS D-019)
  n_estimators: 100
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_jobs: 4
  deterministic: true
  force_col_wise: true
  verbose: -1
onnx:
  # trees per TreeEnsemble node; splitting the ensemble reduces float32 accumulation error
  split: 100
  target_opset: 15
  parity_rows: 1000
  parity_max_abs_diff: 1.0e-5
