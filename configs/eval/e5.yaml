# E5 gate correctness (SPEC 9, E5): synthetic challengers against a fixed champion on the same
# shadow-scored events. Expected decisions: better -> promote, equal -> decline, worse -> decline.
version: 1
dataset: cicids2017
model_config: configs/model.yaml
rollout_config: configs/rollout.yaml
champion_days: [monday, tuesday]
# drift arrives on this day; its older part trains the better challenger and its newer part is the
# evaluation pool (time-ordered split)
post_drift_days: [wednesday]
post_drift_train_fraction: 0.5
shadow_sample_seed: 13
label_shuffle_seed: 17
expected: {better: promote, equal: decline, worse: decline}
