services:
  - type: web
    name: driftguard-ieee-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.serving.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MLFLOW_TRACKING_URI
        value: sqlite:///mlruns/mlflow.db
      - key: HEALING_MODE
        value: ALERT_ONLY
      - key: METRICS_ENABLED
        value: "true"
    plan: free
