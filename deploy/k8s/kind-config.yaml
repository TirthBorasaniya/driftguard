# Single-node kind cluster for DriftGuard (SPEC 8.1). The repository's data/ directory is mounted
# into the node so jobs can read the raw datasets; the offline store lives on a local-path PVC.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: driftguard
nodes:
  - role: control-plane
    image: kindest/node:v1.31.2
    extraMounts:
      - hostPath: ./data
        containerPath: /driftguard-data
        readOnly: true
    extraPortMappings:
      - containerPort: 30001
        hostPort: 8001
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
