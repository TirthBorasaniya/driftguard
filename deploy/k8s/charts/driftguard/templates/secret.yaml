apiVersion: v1
kind: Secret
metadata:
  name: driftguard-secrets
  labels: {{- include "driftguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ required "secrets.adminToken is required" .Values.secrets.adminToken | quote }}
  ip-hash-salt: {{ required "secrets.ipHashSalt is required" .Values.secrets.ipHashSalt | quote }}
